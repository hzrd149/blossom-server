volumes:
  data: {}
  prometheus-data: {}

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - blossom
    restart: unless-stopped

  blossom:
    build: .
    environment:
      # Refuse to boot with open defaults if the config bind mount is missing or invalid.
      BLOSSOM_REQUIRE_CONFIG: "1"
    ports:
      - "3000:3000"
      # Local-only metrics access; config.yml must enable metrics on 0.0.0.0:3001.
      - "127.0.0.1:3001:3001"
    volumes:
      # Named volume for SQLite DB and blob storage
      - data:/app/data
      # Host-mounted config (read-only). Copy config.example.yml → config.yml to start.
      - ./config.yml:/app/config.yml:ro
    restart: unless-stopped
    healthcheck:
      # Lightweight TCP probe — avoids needing curl/wget in the alpine image.
      # Deno's HTTP server is ready when it accepts connections on port 3000.
      test: [
        "CMD-SHELL",
        "wget -qO- http://localhost:3000/ >/dev/null 2>&1 || exit 1",
      ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
